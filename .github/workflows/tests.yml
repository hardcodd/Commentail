name: Tests and distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack:
          - {wagtail: '~=7.4.3', django: '~=5.2.18'}
          - {wagtail: '~=7.4.3', django: '~=6.0.0'}
          - {wagtail: '~=8.0.0', django: '~=5.2.18'}
          - {wagtail: '~=8.0.0', django: '~=6.0.0'}
          - {wagtail: '~=8.0.0', django: '~=6.1.0'}
        python: ['3.12', '3.13', '3.14']
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commentail_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGUSER: commentail_test
      PGPASSWORD: synthetic-ci-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      COMMENTAIL_TEST_POSTGRES: ${{ matrix.database == 'postgres' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the selected supported framework pair
        env:
          WAGTAIL_SPEC: ${{ matrix.stack.wagtail }}
          DJANGO_SPEC: ${{ matrix.stack.django }}
        run: python -m pip install -r requirements-test-common.txt "Wagtail$WAGTAIL_SPEC" "Django$DJANGO_SPEC" .
      - run: python -m pip check
      - name: Test installed library outside the checkout
        env:
          COMMENTAIL_TEST_SQLITE: ${{ runner.temp }}/contracts.sqlite3
        shell: bash
        run: |
          work=$(mktemp -d)
          cp -R tests "$work/tests"
          cd "$work"
          python -m django test tests --settings=tests.settings --noinput
          python -m django makemigrations --check --dry-run --settings=tests.settings

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt ruff==0.16.9
      - run: ruff check commentail tests example tools
      - run: node --test tests/test_*.js
      - run: python -m django makemigrations --check --dry-run --settings=tests.settings
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Check shipped translation catalog
        run: |
          msgfmt --check commentail/locale/ru/LC_MESSAGES/django.po -o /tmp/commentail.mo
          cmp /tmp/commentail.mo commentail/locale/ru/LC_MESSAGES/django.mo

  distributions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [contracts, quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt setuptools==84.0.0
      - name: Build wheel from source distribution
        shell: bash
        run: |
          python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")'
          mkdir unpacked
          tar -xzf dist/commentail-*.tar.gz -C unpacked
          destination="$PWD/dist"
          cd unpacked/commentail-*
          python -c 'import sys; from setuptools.build_meta import build_wheel; build_wheel(sys.argv[1])' "$destination"
      - run: python tools/check_dist.py dist
      - run: python -m pip install --no-deps dist/*.whl
      - name: Verify installed wheel and runnable source example
        shell: bash
        run: |
          work=$(mktemp -d)
          cp -R tests "$work/tests"
          cd "$work"
          COMMENTAIL_TEST_SQLITE="$work/contracts.sqlite3" python -m django test tests --settings=tests.settings --noinput
          cd "$GITHUB_WORKSPACE"/unpacked/commentail-*/example
          python manage.py migrate --noinput
          python manage.py bootstrap_demo
          python manage.py bootstrap_demo
          python manage.py check
          python manage.py process_commentail
          python manage.py collectstatic --noinput
