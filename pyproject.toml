[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commentail"
version = "0.1.0.dev0"
description = "Comments for Wagtail CMS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["Django>=5.2,<5.3", "Wagtail>=7.4,<7.5", "regex>=2026.9.29"]

[tool.setuptools.packages.find]
include = ["commentail*"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.6"]

[tool.ruff]
target-version = "py312"

[tool.setuptools.package-data]
commentail = ["templates/**/*.html", "templates/**/*.txt", "static/**/*.css", "static/**/*.js", "locale/**/*.mo", "locale/**/*.po"]
