[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commentail"
version = "0.1.0"
description = "Self-hosted Wagtail comments with moderation, verified guests and threaded replies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["Django>=5.2,<5.3", "Wagtail>=7.4.3,<7.5", "regex>=2026.9.29"]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django :: 5.2",
    "Framework :: Wagtail",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Source = "https://github.com/hardcodd/Commentail"
Issues = "https://github.com/hardcodd/Commentail/issues"
Documentation = "https://github.com/hardcodd/Commentail/wiki"
Changelog = "https://github.com/hardcodd/Commentail/blob/main/CHANGELOG.md"
Funding = "https://pay.cloudtips.ru/p/f92ee349"

[tool.setuptools.packages.find]
include = ["commentail*"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.6"]

[tool.ruff]
target-version = "py312"

[tool.setuptools.package-data]
commentail = ["templates/**/*.html", "templates/**/*.txt", "static/**/*.css", "static/**/*.js", "locale/**/*.mo", "locale/**/*.po"]
